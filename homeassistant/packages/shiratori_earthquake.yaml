# JMA Tateishi local intensity; see helpers/shiratori_earthquakes.py.
command_line:
  - sensor:
      name: Shiratori earthquake feed
      unique_id: shiratori_earthquake_feed
      command: "python3 /config/helpers/shiratori_earthquakes.py"
      command_timeout: 90
      scan_interval: 30
      value_template: "{{ value_json.status }}"
      json_attributes: [checked_at, events, error, history, history_count]
      icon: mdi:earth

shell_command:
  earthquake_record_alert: >-
    python3 /config/helpers/shiratori_earthquakes.py --record-alert
    '{{ event_id }}' '{{ intensity }}' '{{ stage }}' '{{ speech }}'

input_boolean:
  earthquake_alert_active:
    name: Earthquake alert active
    icon: mdi:alert

input_text:
  earthquake_seen_events:
    name: Earthquake seen events
    max: 255
  earthquake_paused_automations:
    name: Earthquake paused automations
    max: 255
  earthquake_saved_mini:
    name: Earthquake saved Mini
    max: 255
  earthquake_saved_floor:
    name: Earthquake saved Hall
    max: 255
  earthquake_saved_play_1:
    name: Earthquake saved Hue play 1
    max: 255
  earthquake_saved_play_2:
    name: Earthquake saved Hue play 2
    max: 255

script:
  shiratori_earthquake_restore:
    alias: Earthquake - restore lights and automations
    mode: single
    sequence:
      - variables:
          lamps:
            - {light: light.mini, saved: input_text.earthquake_saved_mini}
            - {light: light.signe_gradient_floor_1, saved: input_text.earthquake_saved_floor}
            - {light: light.hue_play_1, saved: input_text.earthquake_saved_play_1}
            - {light: light.hue_play_2, saved: input_text.earthquake_saved_play_2}
          competing:
            - automation.solar_battery_kitchen_mini_light_update_on_battery_change
            - automation.kitchen_mini_off_restore_solar_battery_light_level
            - automation.pc_desk_hue_on_when_external_display_connected
            - automation.pc_desk_hue_off_when_no_external_display
            - automation.hall_light_katsushika_rain
            - automation.hall_light_rainfall_shimmer
      - repeat:
          for_each: "{{ lamps }}"
          sequence:
            - variables:
                saved: "{{ states(repeat.item.saved) | from_json({}) }}"
            - choose:
                - conditions: "{{ saved.get('state') == 'off' }}"
                  sequence:
                    - action: light.turn_off
                      continue_on_error: true
                      target:
                        entity_id: "{{ repeat.item.light }}"
                      data: {transition: 0}
                - conditions: "{{ saved.get('state') == 'on' }}"
                  sequence:
                    - action: light.turn_on
                      continue_on_error: true
                      target:
                        entity_id: "{{ repeat.item.light }}"
                      data: "{{ dict(saved.data, transition=0) }}"
      # Allow Hue's final state updates before re-enabling off-triggered rules.
      - delay: {seconds: 2}
      - repeat:
          for_each: "{{ competing }}"
          sequence:
            - if: "{{ (repeat.index - 1) | string in states('input_text.earthquake_paused_automations') }}"
              then:
                - action: automation.turn_on
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.earthquake_alert_active

  shiratori_earthquake_alert:
    alias: Earthquake - Hue lights and Alexa
    description: Local shindo warning; Smooth brightness pulses between 20 and 100 percent.
    mode: single
    fields:
      intensity:
        required: true
        selector: {text: null}
      test_mode:
        default: false
        selector: {boolean: null}
    sequence:
      - condition: template
        value_template: "{{ intensity | string in ['3', '4', '5-', '5+', '6-', '6+', '7'] }}"
      - variables:
          tier: "{{ 1 if intensity | string == '3' else 2 if intensity | string == '4' else 3 }}"
          duration: "{{ 5 if tier == 1 else 10 if tier == 2 else 30 }}"
          color: "{{ [60,100] if tier == 1 else [30,100] if tier == 2 else [0,100] }}"
          spoken: "{{ intensity | string | replace('-', ' lower') | replace('+', ' upper') }}"
          lamps:
            - {light: light.mini, saved: input_text.earthquake_saved_mini}
            - {light: light.signe_gradient_floor_1, saved: input_text.earthquake_saved_floor}
            - {light: light.hue_play_1, saved: input_text.earthquake_saved_play_1}
            - {light: light.hue_play_2, saved: input_text.earthquake_saved_play_2}
          competing:
            - automation.solar_battery_kitchen_mini_light_update_on_battery_change
            - automation.kitchen_mini_off_restore_solar_battery_light_level
            - automation.pc_desk_hue_on_when_external_display_connected
            - automation.pc_desk_hue_off_when_no_external_display
            - automation.hall_light_katsushika_rain
            - automation.hall_light_rainfall_shimmer
          enabled_mask: >-
            {% set ns = namespace(mask='') %}
            {% for e in competing %}{% if is_state(e, 'on') %}{% set ns.mask = ns.mask ~ loop.index0 %}{% endif %}{% endfor %}
            {{ ns.mask }}
          available_lights: >-
            {{ expand(lamps | map(attribute='light') | list) | selectattr('state', 'in', ['on','off']) | map(attribute='entity_id') | list }}
          pulse_target: >-
            {{ ['light.earthquake_alert'] if states('light.earthquake_alert') in ['on','off'] else available_lights }}
      - action: input_text.set_value
        target: {entity_id: input_text.earthquake_paused_automations}
        data:
          value: "{{ enabled_mask }}"
      - repeat:
          for_each: "{{ lamps }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: "{{ repeat.item.saved }}"
              data:
                value: >-
                  {% set e = repeat.item.light %}
                  {% set d = dict(brightness=state_attr(e, 'brightness') | int(1)) %}
                  {% if state_attr(e, 'color_mode') == 'color_temp' %}
                    {% set d = dict(d, color_temp_kelvin=state_attr(e, 'color_temp_kelvin')) %}
                  {% elif state_attr(e, 'xy_color') is not none %}
                    {% set d = dict(d, xy_color=state_attr(e, 'xy_color')) %}
                  {% endif %}
                  {% if state_attr(e, 'effect') is not none %}{% set d = dict(d, effect=state_attr(e, 'effect')) %}{% endif %}
                  {{ dict(state=states(e), data=d) | to_json }}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.earthquake_alert_active}
      - action: automation.turn_off
        continue_on_error: true
        target:
          entity_id: "{{ competing }}"
        data: {stop_actions: true}
      - action: script.turn_off
        continue_on_error: true
        target:
          entity_id:
            - script.solar_battery_kitchen_mini_light_mapped_brightness
            - script.pc_hue_desk_on
            - script.pc_hue_desk_off
            - script.hall_rain_shimmer
      - parallel:
          - sequence:
              - if: >-
                  {{ not (test_mode | default(false) | bool) and
                     ((tier == 1 and 10 <= now().hour < 20) or
                      (tier > 1 and 8 <= now().hour < 22)) }}
                then:
                  - action: notify.alexa_media
                    continue_on_error: true
                    data:
                      target:
                        - media_player.hall_echo_dot
                        - media_player.bedroom_echo_dot
                        - media_player.echo_show
                      message: "Earthquake warning: local intensity {{ spoken }}."
                      data: {type: tts}
          - sequence:
              - if: "{{ available_lights | length > 0 }}"
                then:
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: "{{ pulse_target }}"
                    data:
                      hs_color: "{{ color }}"
                      brightness_pct: 20
                      transition: 0
                  - variables:
                      started: "{{ as_timestamp(now()) }}"
                  - repeat:
                      count: "{{ duration }}"
                      sequence:
                        - if: "{{ as_timestamp(now()) < started + duration }}"
                          then:
                            - action: light.turn_on
                              continue_on_error: true
                              target:
                                entity_id: "{{ pulse_target }}"
                              data: {brightness_pct: 100, transition: 0.5}
                        - delay:
                            milliseconds: "{{ [0, ((started + repeat.index - 0.5 - as_timestamp(now())) * 1000) | int] | max }}"
                        - if: "{{ as_timestamp(now()) < started + duration }}"
                          then:
                            - action: light.turn_on
                              continue_on_error: true
                              target:
                                entity_id: "{{ pulse_target }}"
                              data: {brightness_pct: 20, transition: 0.5}
                        - delay:
                            milliseconds: "{{ [0, ((started + repeat.index - as_timestamp(now())) * 1000) | int] | max }}"
      - action: script.shiratori_earthquake_restore


automation:
  - id: shiratori_earthquake_warning
    alias: Shiratori - local earthquake warning
    description: JMA Tateishi shindo 3/4/5-lower+, epicentre within 500 km. Report-based, not early warning.
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.shiratori_earthquake_feed
    conditions:
      - condition: state
        entity_id: sensor.shiratori_earthquake_feed
        state: 'ok'
      - condition: state
        entity_id: input_boolean.earthquake_alert_active
        state: 'off'
      - condition: template
        value_template: "{{ 0 <= as_timestamp(now()) - as_timestamp(state_attr('sensor.shiratori_earthquake_feed','checked_at'), 0) < 120 }}"
    actions:
      - repeat:
          for_each: "{{ state_attr('sensor.shiratori_earthquake_feed', 'events') or [] }}"
          sequence:
            - variables:
                event: "{{ repeat.item }}"
                seen: "{{ states('input_text.earthquake_seen_events') | from_json({}) }}"
            - if: "{{ event.tier > seen.get(event.id, 0) and 0 <= as_timestamp(now()) - as_timestamp(event.occurred_at, 0) <= 1200 }}"
              then:
                # Persist before speaking to suppress duplicate reports/restarts.
                - action: input_text.set_value
                  target: {entity_id: input_text.earthquake_seen_events}
                  data:
                    value: >-
                      {% set ns = namespace(pairs=[]) %}
                      {% for k,v in (seen | dictsort)[-9:] if k != event.id %}{% set ns.pairs = ns.pairs + [(k,v)] %}{% endfor %}
                      {{ dict(ns.pairs + [(event.id,event.tier)]) | to_json }}
                - action: shell_command.earthquake_record_alert
                  continue_on_error: true
                  data:
                    event_id: "{{ event.id }}"
                    intensity: "{{ event.intensity }}"
                    stage: started
                    speech: "{{ 'allowed' if (event.tier == 1 and 10 <= now().hour < 20) or (event.tier > 1 and 8 <= now().hour < 22) else 'quiet' }}"
                - action: script.shiratori_earthquake_alert
                  data:
                    intensity: "{{ event.intensity }}"
                - action: shell_command.earthquake_record_alert
                  continue_on_error: true
                  data:
                    event_id: "{{ event.id }}"
                    intensity: "{{ event.intensity }}"
                    stage: completed
                    speech: "{{ 'allowed' if (event.tier == 1 and 10 <= now().hour < 20) or (event.tier > 1 and 8 <= now().hour < 22) else 'quiet' }}"

  - id: shiratori_earthquake_recovery
    alias: Shiratori - recover interrupted earthquake lights
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.earthquake_alert_active
        to: 'on'
        for: '00:02:00'
    conditions:
      - condition: state
        entity_id: input_boolean.earthquake_alert_active
        state: 'on'
    actions:
      - action: script.turn_off
        target: {entity_id: script.shiratori_earthquake_alert}
      - delay: {seconds: 5}
      - action: script.shiratori_earthquake_restore
